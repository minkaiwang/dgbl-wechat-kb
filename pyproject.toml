[project]
name = "dgbl-wechat-kb"
version = "0.2.0"
description = "Auditable full-text WeChat Official Account knowledge base"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "jieba>=0.42.1,<1",
  "markdownify>=0.14,<2",
  "mkdocs-material>=9.6,<10",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
browser = [
  "camoufox[geoip]>=0.4,<1",
]
test = [
  "jsonschema>=4.25,<5",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
