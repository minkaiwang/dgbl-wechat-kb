<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">数字游戏学习研究公众号公开元数据集概览</title>
  <desc id="desc">475 条公众号帖子元数据，覆盖 2024 至 2026 年，提供 JSONL、CSV 与 CC BY 4.0 许可。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182b"/>
      <stop offset="0.55" stop-color="#102e50"/>
      <stop offset="1" stop-color="#12485a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45a3ff"/>
      <stop offset="1" stop-color="#29d3b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00111f" flood-opacity="0.35"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8ad8ff" opacity="0.15"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7adbc8"/>
    </marker>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#background)"/>
  <rect width="1280" height="560" rx="28" fill="url(#dots)"/>
  <circle cx="1160" cy="-20" r="240" fill="#2f7ee6" opacity="0.13"/>
  <circle cx="1220" cy="90" r="120" fill="#29d3b2" opacity="0.10"/>
  <path d="M70 184 H1210" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>

  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <text x="70" y="54" fill="#7fddcf" font-size="16" font-weight="700" letter-spacing="2.2">OPEN METADATA RELEASE · v0.1.1</text>
    <text x="70" y="112" fill="#ffffff" font-size="40" font-weight="700">数字游戏学习研究 · 公众号数据集</text>
    <text x="70" y="158" fill="#bfd3e6" font-size="22">公开帖子元数据 · 可追溯 · 可复现 · 可回到微信原文核验</text>

    <g filter="url(#shadow)">
      <g transform="translate(64 216)">
        <rect width="270" height="144" rx="18" fill="#ffffff" opacity="0.96"/>
        <circle cx="34" cy="34" r="15" fill="#2f7ee6" opacity="0.15"/>
        <path d="M29 27 H39 M29 33 H39 M29 39 H36" stroke="#2f7ee6" stroke-width="2.5" stroke-linecap="round"/>
        <text x="28" y="96" fill="#0b2742" font-size="46" font-weight="800">475</text>
        <text x="28" y="124" fill="#567087" font-size="17">条公开帖子元数据</text>
      </g>

      <g transform="translate(358 216)">
        <rect width="270" height="144" rx="18" fill="#ffffff" opacity="0.96"/>
        <circle cx="34" cy="34" r="15" fill="#29b89f" opacity="0.16"/>
        <path d="M27 34 H41 M34 27 V41" stroke="#168c79" stroke-width="2.5" stroke-linecap="round"/>
        <text x="28" y="92" fill="#0b2742" font-size="35" font-weight="800">2024—2026</text>
        <text x="28" y="124" fill="#567087" font-size="17">公开合集发布日期跨度</text>
      </g>

      <g transform="translate(652 216)">
        <rect width="270" height="144" rx="18" fill="#ffffff" opacity="0.96"/>
        <circle cx="34" cy="34" r="15" fill="#f0b83f" opacity="0.20"/>
        <path d="M27 29 H41 V40 H27 Z M30 25 H38" fill="none" stroke="#b67b00" stroke-width="2.3" stroke-linejoin="round"/>
        <text x="28" y="92" fill="#0b2742" font-size="31" font-weight="800">JSONL · CSV</text>
        <text x="28" y="124" fill="#567087" font-size="17">结构化文件与完整 ZIP</text>
      </g>

      <g transform="translate(946 216)">
        <rect width="270" height="144" rx="18" fill="#ffffff" opacity="0.96"/>
        <circle cx="34" cy="34" r="15" fill="#8469e8" opacity="0.17"/>
        <path d="M34 25 L42 29 V35 C42 40 39 43 34 46 C29 43 26 40 26 35 V29 Z" fill="none" stroke="#6650bd" stroke-width="2.2"/>
        <text x="28" y="92" fill="#0b2742" font-size="31" font-weight="800">CC BY 4.0</text>
        <text x="28" y="124" fill="#567087" font-size="17">元数据与项目文档许可</text>
      </g>
    </g>

    <g fill="none" stroke="#7adbc8" stroke-width="2.5" opacity="0.9" marker-end="url(#arrow)">
      <path d="M210 438 H430"/>
      <path d="M515 438 H735"/>
      <path d="M820 438 H1040"/>
    </g>
    <g>
      <circle cx="170" cy="438" r="24" fill="#45a3ff"/>
      <circle cx="475" cy="438" r="24" fill="#29d3b2"/>
      <circle cx="780" cy="438" r="24" fill="#f0b83f"/>
      <circle cx="1085" cy="438" r="24" fill="#8c73ea"/>
      <text x="170" y="445" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">1</text>
      <text x="475" y="445" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">2</text>
      <text x="780" y="445" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">3</text>
      <text x="1085" y="445" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">4</text>
      <text x="170" y="493" fill="#e5f2fc" font-size="17" font-weight="600" text-anchor="middle">微信原文</text>
      <text x="475" y="493" fill="#e5f2fc" font-size="17" font-weight="600" text-anchor="middle">公开边界过滤</text>
      <text x="780" y="493" fill="#e5f2fc" font-size="17" font-weight="600" text-anchor="middle">质量与权利审计</text>
      <text x="1085" y="493" fill="#e5f2fc" font-size="17" font-weight="600" text-anchor="middle">版本化 Release</text>
    </g>
    <text x="640" y="538" fill="#86a9c3" font-size="14" text-anchor="middle">不包含文章正文、摘要片段、原始 HTML 或图片</text>
  </g>
</svg>
