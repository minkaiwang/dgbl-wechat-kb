name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-release:
    name: Public release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12 --extra test

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build deterministic release assets
        run: uv run python scripts/build_release_assets.py --output dist

      - name: Validate public boundary and Git history
        run: uv run python scripts/validate_public_release.py --history

      - name: Build metadata site strictly
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: uv run mkdocs build --strict

      - name: Confirm checks did not change tracked files
        run: git diff --exit-code
